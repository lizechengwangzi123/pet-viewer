<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#bfe3f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" href="data:," />
  <title>云宠物世界 · 公园（第 3 步原型）</title>
  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three/build/three.module.js",
      "three/addons/": "../vendor/three/examples/jsm/"
    }
  }
  </script>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="scene" aria-label="3D 公园"></canvas>

  <div id="hud">
    <div id="hint">点地面或用摇杆走路，狗狗会跟着你</div>
    <button id="settings-btn" type="button" aria-label="设置：修改形象和昵称"><span aria-hidden="true">⚙</span><span id="settings-name"></span></button>
    <div id="fps-box">
      <span id="fps">FPS --</span>
      <button id="fps-close" type="button" aria-label="关闭 FPS">×</button>
    </div>
    <button id="fps-open" type="button" hidden>FPS</button>
    <div id="photo-bar">
      <button id="photo-tag" class="pill" type="button" aria-pressed="true" aria-label="照片里拍不拍名牌"><span aria-hidden="true">🏷</span><span class="label">名牌：拍</span></button>
      <button id="photo-mode" class="pill" type="button" aria-pressed="false" aria-label="拍照模式：相机转到正面"><span aria-hidden="true">📷</span><span class="label">拍照模式</span></button>
      <button id="shutter" type="button" aria-label="拍照"><span class="ring"></span></button>
    </div>
    <div id="joystick" aria-label="虚拟摇杆"><div class="knob"></div></div>
    <div id="credit">
      <div>宠物为测试模型：TripoSR 根据 <a href="https://commons.wikimedia.org/wiki/File:Boxer_dog_posing_on_the_grass.jpg" target="_blank" rel="noopener">Wikimedia Commons CC0 照片</a>生成，骨骼动画由团队制作</div>
      <div>卡通人物：Kenney「Mini Characters」(<a href="https://www.kenney.nl" target="_blank" rel="noopener">www.kenney.nl</a>)，CC0</div>
      <div>本页只放公开测试素材，不含任何用户照片或模型。</div>
    </div>
  </div>

  <div id="setup" hidden>
    <div class="setup-card scrollable" role="dialog" aria-modal="true" aria-labelledby="setup-title">
      <h1 id="setup-title">选一个形象，起个昵称</h1>
      <div class="setup-body">
        <section class="setup-col">
          <div class="setup-label">1. 选形象</div>
          <div id="owner-list" role="radiogroup" aria-label="卡通形象"></div>
        </section>
        <section class="setup-col">
          <label class="setup-label" for="nick">2. 昵称</label>
          <div class="nick-row">
            <input id="nick" type="text" inputmode="text" enterkeyhint="done" autocomplete="nickname" autocapitalize="off" spellcheck="false" />
            <span id="nick-count">0/12</span>
          </div>
          <div id="nick-msg">昵称只存在这台手机上，不会上传</div>
          <div class="setup-actions">
            <button id="setup-cancel" type="button" hidden>取消</button>
            <button id="setup-ok" type="button" disabled>进入公园</button>
          </div>
        </section>
      </div>
      <div class="setup-credit">卡通人物：Kenney「Mini Characters」(www.kenney.nl)，CC0 · 本页只放公开测试素材，不含任何用户照片或模型。</div>
    </div>
  </div>

  <div id="flash" aria-hidden="true"></div>
  <div id="photo-preview" hidden>
    <div class="photo-card scrollable" role="dialog" aria-modal="true" aria-label="照片预览">
      <button id="photo-close" type="button" aria-label="关闭">×</button>
      <img id="photo-img" alt="" />
      <div class="photo-side">
        <div id="photo-msg"></div>
        <div class="photo-actions">
          <button id="photo-again" type="button">再拍一张</button>
          <button id="photo-save" type="button">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="loading"><div class="spinner"></div><div id="loading-text">正在加载公园…</div></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
